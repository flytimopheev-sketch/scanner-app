name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rpm:
    name: Сборка RPM с бинарниками (для РЕД ОС, офлайн-установка)
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Инструменты сборки
        run: |
          dnf install -y rpm-build cargo clang gtk4-devel libadwaita-devel tar pip curl
      # Rust через rustup (для cargo zigbuild нужен его target-менеджер)
      - name: rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Сборка под glibc 2.34 (РЕД ОС 8 / RHEL 9): cargo-zigbuild + zig
      - name: cargo-zigbuild + zig
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add x86_64-unknown-linux-gnu
          cargo install cargo-zigbuild
          pip install --break-system-packages "ziglang==0.13.0" || pip install "ziglang==0.13.0"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > /usr/local/bin/zig
          chmod +x /usr/local/bin/zig
      - name: Release-сборка (glibc 2.34)
        env:
          RUSTFLAGS: "-L native=/usr/lib64"
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.34
      - name: Проверка бинарников
        run: |
          test -x target/x86_64-unknown-linux-gnu/release/scanner-gui
          test -x target/x86_64-unknown-linux-gnu/release/scanner-worker
          test -x target/x86_64-unknown-linux-gnu/release/scanner-cli
      - name: Сборка RPM
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p ~/rpmbuild/SOURCES
          # Тар с собранными бинарниками + лицензия/док для %files
          mkdir -p /tmp/binpkg && cd /tmp/binpkg
          cp -a "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/release/scanner-gui" \
                "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/release/scanner-worker" \
                "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/release/scanner-cli" .
          cp -a "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/README.md" .
          tar czf ~/rpmbuild/SOURCES/scanner-app-${VER}-bin.tar.gz \
            --transform "s,^,scanner-app-${VER}/," .
          cp "$GITHUB_WORKSPACE/packaging/scanner-app.desktop" \
             "$GITHUB_WORKSPACE/packaging/scanner-app.svg" ~/rpmbuild/SOURCES/
          rpmbuild -bb "$GITHUB_WORKSPACE/packaging/scanner-app.spec" \
            --define "_sourcedir $HOME/rpmbuild/SOURCES"
          cp ~/rpmbuild/RPMS/*/*.rpm "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: "*.rpm"

  github-release:
    name: Публикация GitHub Release
    runs-on: ubuntu-24.04
    needs: rpm
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rpm
      - name: Создать Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            *.rpm