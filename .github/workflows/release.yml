name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_number:
        description: "Номер Release для RPM (например 9). Пусто — взять из последнего тега v*"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  # Каталог бинарников, слинкованных под glibc 2.34 (РЕД ОС 8 / RHEL 9)
  TARGET_DIR: target/x86_64-unknown-linux-gnu/release

jobs:
  rpm:
    name: Сборка RPM на GitHub-раннере (без Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # теги нужны, чтобы взять номер Release

      - uses: dtolnay/rust-toolchain@stable
        with:
          # cargo-zigbuild линкует под эту цель с заданной версией glibc
          targets: x86_64-unknown-linux-gnu

      - name: Пакеты (GTK4/libadwaita + rpm-build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev pkg-config clang rpm binutils libvulkan-dev

      - name: Кэш Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: cargo-zigbuild + zig (линковка под glibc 2.34)
        run: |
          command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild
          python3 -m pip install --break-system-packages "ziglang==0.13.0"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version

      # zig cc намеренно НЕ ищет системные каталоги (/usr/lib/x86_64-linux-gnu):
      # https://github.com/ziglang/zig/issues/16733 — из-за этого GTK4/libadwaita
      # для линковки не находятся («searched paths: none»). Делаем каталог-витрину.
      # Кладём туда ТОЛЬКО библиотеки GTK-стека: libc/libm берём из sysroot zig,
      # иначе бинарник унаследует glibc хоста (2.39) и не запустится на РЕД ОС 8
      # (glibc 2.36). Это же проверяется шагом ниже по символам ELF.
      - name: Каталог GTK-библиотек для zig-линковщика
        run: |
          mkdir -p /tmp/gtk-libs
          for name in adwaita-1 gtk-4 pangocairo-1.0 pango-1.0 harfbuzz \
                      gdk_pixbuf-2.0 cairo-gobject cairo vulkan graphene-1.0 \
                      gio-2.0 gobject-2.0 glib-2.0; do
            src=""
            for cand in "/usr/lib/x86_64-linux-gnu/lib${name}.so" \
                        /usr/lib/x86_64-linux-gnu/lib${name}.so.*; do
              if [ -e "$cand" ]; then src="$cand"; fi
            done
            if [ -z "$src" ]; then echo "::error::не найдена lib${name}"; exit 1; fi
            ln -sf "$src" "/tmp/gtk-libs/lib${name}.so"
            echo "lib${name}.so -> $src"
          done

      - name: Номер Release RPM
        id: rel
        env:
          INPUT_REL: ${{ inputs.release_number }}
        run: |
          NAME="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            NAME="$(git tag --list 'v*' --sort=-creatordate | head -n1)"
          fi
          REL="${NAME##*-}"
          case "$REL" in ''|*[!0-9]*) REL=1 ;; esac
          if [ -n "${INPUT_REL:-}" ]; then REL="$INPUT_REL"; fi
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
          echo "Release: $REL (источник: ${NAME:-нет тега})"

      - name: Release-сборка под glibc 2.34
        env:
          # Только GTK-стек: libc приходит из sysroot zig (см. шаг выше)
          RUSTFLAGS: "-L native=/tmp/gtk-libs"
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.34

      - name: Проверка бинарников
        run: |
          test -x "$TARGET_DIR/scanner-gui"
          test -x "$TARGET_DIR/scanner-worker"
          test -x "$TARGET_DIR/scanner-cli"
          # Бинарник не должен требовать glibc новее цели: РЕД ОС 8 — glibc 2.36,
          # поэтому проверяем по версиям символов ELF, а не «на глазок».
          FAIL=0
          for b in scanner-gui scanner-worker scanner-cli; do
            GLIBC=$(objdump -T "$TARGET_DIR/$b" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n1)
            GLIB=$(objdump -T "$TARGET_DIR/$b" | grep -oE 'GLIB_[0-9]+\.[0-9]+' | sort -Vu | tail -n1)
            echo "$b: требует ${GLIBC:-нет} / ${GLIB:-нет}"
            if [ -n "$GLIBC" ] && [ "$(printf '%s\n' GLIBC_2.34 "$GLIBC" | sort -V | tail -n1)" != "GLIBC_2.34" ]; then
              echo "::error::$b требует $GLIBC — не запустится на РЕД ОС 8 (glibc 2.36)"
              FAIL=1
            fi
            if [ -n "$GLIB" ] && [ "$(printf '%s\n' GLIB_2.78 "$GLIB" | sort -V | tail -n1)" != "GLIB_2.78" ]; then
              echo "::warning::$b требует $GLIB: в РЕД ОС 8 установлен glib 2.78"
            fi
          done
          objdump -p "$TARGET_DIR/scanner-gui" | grep NEEDED || true
          exit $FAIL

      - name: Сборка RPM (rpmbuild, без Docker)
        run: bash scripts/build-rpm.sh "$TARGET_DIR" "${{ steps.rel.outputs.rel }}"

      - name: Проверка метаданных RPM
        run: |
          RPM=$(ls -1 scanner-app-*.rpm | head -n1)
          echo "Пакет: $RPM"
          rpm -qpR "$RPM" | tee /tmp/req.txt
          grep -qx sane-backends /tmp/req.txt || { echo "::error::нет Requires: sane-backends"; exit 1; }
          if grep -q '/usr/lib' /tmp/req.txt; then
            echo "::error::в RPM попали жёсткие ELF-зависимости (офлайн-установка сломается)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: "*.rpm"

  github-release:
    name: Публикация GitHub Release
    runs-on: ubuntu-24.04
    needs: rpm
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpm
      - name: Контрольная сумма
        run: |
          sha256sum *.rpm > SHA256SUMS
          cat SHA256SUMS
      - name: Создать/обновить Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="$GITHUB_REPOSITORY"
          if gh release view --repo "$REPO" "$TAG" > /dev/null 2>&1; then
            gh release upload --repo "$REPO" --clobber "$TAG" ./*.rpm SHA256SUMS
          else
            gh release create --repo "$REPO" "$TAG" \
              --title "Release $TAG" \
              --verify-tag \
              --generate-notes \
              ./*.rpm SHA256SUMS
          fi
