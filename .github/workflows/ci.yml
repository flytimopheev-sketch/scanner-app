name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Проверка и тесты (clippy-free check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Пакеты разработки GTK4/libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev pkg-config clang
      - name: cargo check (все фичи)
        run: cargo check --workspace --all-features
      - name: cargo test (все крейты)
        run: cargo test --workspace

  mock-smoke:
    name: Смок-тест на mock-бэкенде (CLI + воркер)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Пакеты разработки GTK4/libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev pkg-config clang
      - name: Сборка
        run: cargo build --workspace
      - name: "scanner-cli: устройства + mock-скан в PDF"
        run: |
          SCANNER_BACKEND=mock target/debug/scanner-cli --list-devices
          SCANNER_BACKEND=mock target/debug/scanner-cli --out /tmp/demo.pdf
          test -s /tmp/demo.pdf
      - name: "scanner-worker: протокол JSON-lines"
        run: |
          (echo '{"id":1,"cmd":"ping"}'; echo '{"id":2,"cmd":"shutdown"}') \
            | SCANNER_BACKEND=mock timeout 15 target/debug/scanner-worker \
            | grep -q '"version"'

  screenshots:
    name: Скриншот-сценарий (SCANNER_SHOTS под Xvfb)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Пакеты (GTK + Xvfb + инструменты снимков)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev pkg-config clang \
            xvfb x11-xserver-utils x11-utils x11-apps netpbm \
            adwaita-icon-theme librsvg2-common dbus-x11
      - name: Сборка
        run: cargo build -p scanner-gui -p scanner-worker
      - name: Снимки интерфейса
        run: bash scripts/screenshots.sh out/
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out/*.png

  rpm:
    name: Сборка RPM (проверка spec, без Docker)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Пакеты (GTK4 + rpm-build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev pkg-config clang rpm binutils
      - name: Release-сборка
        run: cargo build --release
      # Смоук: собирается ли RPM из spec и найденных бинарников.
      # RPM для РЕД ОС (glibc 2.34, номер Release из тега) собирает
      # workflow Release — см. .github/workflows/release.yml
      - name: rpmbuild (без Docker)
        run: bash scripts/build-rpm.sh target/release 1
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-smoke
          path: "*.rpm"
