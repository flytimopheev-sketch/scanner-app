[workspace]
resolver = "2"
members = [
    "crates/scanner-core",
    "crates/scanner-worker",
    "crates/scanner-gui",
    "crates/scanner-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
authors = ["Scanner App Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
tiff = "0.9"
lopdf = "0.34"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gtk4 = { version = "0.9", features = ["v4_6"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
gio = "0.20"
glib = "0.20"
gdk4 = "0.9"
async-channel = "2"

[profile.release]
lto = "thin"
strip = true
