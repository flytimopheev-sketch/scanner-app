[package]
name = "scanner-cli"
description = "CLI for the document scanner: headless scanning to PDF/PNG/JPEG/TIFF"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "scanner-cli"
path = "src/main.rs"

[features]
default = []
sane-ffi = ["scanner-core/sane-ffi"]

[dependencies]
scanner-core = { path = "../scanner-core" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
